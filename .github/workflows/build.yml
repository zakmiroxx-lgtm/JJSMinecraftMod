name: Build Jujutsu Shenanigans

on:
  push:
    paths:
      - 'JujutsuShenanigans.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and Antivirus Scan
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 25
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Extract ZIP
      - name: Extract project
        run: |
          echo "Extracting JujutsuShenanigans.zip..."

          mkdir -p mod

          unzip -q JujutsuShenanigans.zip -d mod

          echo "Extraction complete."

      # 5. Verify project files
      - name: Verify project structure
        run: |
          echo "Checking required files..."

          test -f mod/build.gradle
          test -f mod/settings.gradle
          test -f mod/gradle.properties
          test -f mod/gradlew
          test -f mod/src/main/resources/fabric.mod.json

          echo "Project structure verified."

      # 6. Make Gradle executable
      - name: Make Gradle executable
        run: |
          chmod +x mod/gradlew

      # 7. Build Minecraft mod
      - name: Build Minecraft mod
        working-directory: mod
        run: |
          echo "Building Jujutsu Shenanigans..."
          ./gradlew build --no-daemon

      # 8. List build output
      - name: Show compiled files
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -lah mod/build/libs/

      # 9. Calculate SHA256
      - name: Calculate SHA256
        run: |
          echo "=== SHA256 CHECKSUMS ==="
          sha256sum mod/build/libs/*.jar

      # 10. Inspect JAR contents
      - name: Inspect JAR contents
        run: |
          echo "=== JAR CONTENTS ==="

          for file in mod/build/libs/*.jar; do
            echo "================================"
            echo "Inspecting: $file"
            echo "================================"

            unzip -l "$file"
          done

      # 11. Install antivirus
      - name: Install ClamAV
        run: |
          echo "Installing ClamAV..."

          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam

      # 12. Update virus database
      - name: Update antivirus database
        run: |
          echo "Updating ClamAV database..."

          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      # 13. Scan JAR files
      - name: Scan compiled JAR files
        run: |
          echo "================================"
          echo "CLAMAV ANTIVIRUS SCAN"
          echo "================================"

          clamscan \
            --infected \
            --recursive \
            mod/build/libs/

          echo "================================"
          echo "ANTIVIRUS SCAN COMPLETED"
          echo "================================"

      # 14. Upload verified artifact
      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: JujutsuShenanigans-Verified
          path: mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
