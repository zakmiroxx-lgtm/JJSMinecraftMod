name: Build Jujutsu Shenanigans

on:
  push:
    paths:
      - 'JujutsuShenanigans.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir mod
          unzip JujutsuShenanigans.zip -d mod

      - name: Check files
        run: |
          ls -la mod
          test -f mod/build.gradle
          test -f mod/gradlew

      - name: Make Gradle executable
        run: chmod +x mod/gradlew

      - name: Build Minecraft mod
        working-directory: mod
        run: ./gradlew build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: JujutsuShenanigans-Mod
          path: mod/build/libs/*.jar
          if-no-files-found: error
